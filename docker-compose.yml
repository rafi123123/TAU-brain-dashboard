services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - scan-data:/data/scan-data:rw

  grafana:
    image: grafana/grafana:13.2.1
    depends_on:
      - api
    environment:
      GF_INSTALL_PLUGINS: "frser-sqlite-datasource"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "TAU brain"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app,grafana-exploretraces-app,grafana-pyroscope-app
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - scan-data:/data/scan-data:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  grafana-data:
  scan-data:
