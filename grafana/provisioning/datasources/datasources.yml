apiVersion: 1

deleteDatasources:
  - name: SQLite Data Source
    orgId: 1

datasources:
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: missing-folders
    access: proxy
    isDefault: true
    url: postgres:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $POSTGRES_PASSWORD
    editable: false
