# Alembic configuration, run from the project root with:
#   alembic -c api/alembic.ini upgrade head
# (or from inside the api container, where this file sits in the workdir)

[alembic]
script_location = %(here)s/alembic
path_separator = os

# the database URL is taken from the DATABASE_URL environment variable
# (see alembic/env.py), this empty value is only an overridable placeholder
sqlalchemy.url =

# Logging configuration, consumed by alembic/env.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
